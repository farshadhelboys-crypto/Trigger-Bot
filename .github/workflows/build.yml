name: Build FarshadPM

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release x64
        shell: cmd
        run: |
          msbuild FarshadPM.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FarshadPM-exe
          path: bin/Release/FarshadPM.exe
          if-no-files-found: error
          retention-days: 30
